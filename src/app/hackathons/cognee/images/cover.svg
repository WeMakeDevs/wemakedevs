      <stop offset="0%" stop-color="#160a26"/>
      <stop offset="50%" stop-color="#0d0618"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <radialGradient id="cvGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffb800" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb800" stop-opacity="0"/>
    </radialGradient>
    <filter id="cvNeon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
