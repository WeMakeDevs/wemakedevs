    <line x1="780" y1="0" x2="780" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="700" stroke="#00cfb4" stroke-width="1"/>
