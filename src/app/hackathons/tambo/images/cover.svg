<svg width="1920" height="600" viewBox="0 0 1920 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGradient)"/>
  
  <!-- Stars -->
  <circle cx="100" cy="50" r="1" fill="white" opacity="0.8"/>
  <circle cx="200" cy="150" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="350" cy="80" r="1" fill="white" opacity="0.9"/>
  <circle cx="500" cy="200" r="2" fill="white" opacity="0.7"/>
  <circle cx="650" cy="100" r="1" fill="white" opacity="0.5"/>
  <circle cx="800" cy="180" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="950" cy="50" r="1" fill="white" opacity="0.6"/>
  <circle cx="1100" cy="120" r="2" fill="white" opacity="0.9"/>
  <circle cx="1250" cy="200" r="1" fill="white" opacity="0.7"/>
  <circle cx="1400" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="1550" cy="150" r="1" fill="white" opacity="0.8"/>
  <circle cx="1700" cy="100" r="2" fill="white" opacity="0.6"/>
  <circle cx="1850" cy="180" r="1" fill="white" opacity="0.9"/>
  <circle cx="150" cy="400" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="300" cy="500" r="1" fill="white" opacity="0.5"/>
  <circle cx="450" cy="450" r="2" fill="white" opacity="0.8"/>
  <circle cx="600" cy="520" r="1" fill="white" opacity="0.6"/>
  <circle cx="750" cy="400" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="900" cy="480" r="1" fill="white" opacity="0.7"/>
  <circle cx="1050" cy="550" r="2" fill="white" opacity="0.5"/>
  <circle cx="1200" cy="420" r="1" fill="white" opacity="0.8"/>
  <circle cx="1350" cy="500" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="1500" cy="450" r="1" fill="white" opacity="0.9"/>
  <circle cx="1650" cy="520" r="2" fill="white" opacity="0.7"/>
  <circle cx="1800" cy="400" r="1" fill="white" opacity="0.5"/>
  
  <!-- Lightsaber beams -->
  <rect x="100" y="250" width="300" height="6" rx="3" fill="#f59e0b" filter="url(#glow)" opacity="0.6"/>
  <rect x="1520" y="350" width="300" height="6" rx="3" fill="#f59e0b" filter="url(#glow)" opacity="0.6"/>
  
  <!-- Title Text -->
  <text x="960" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)">THE UI STRIKES BACK</text>
  
  <!-- Subtitle -->
  <text x="960" y="340" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">A WeMakeDevs Hackathon " Powered by Tambo</text>
  
  <!-- Date -->
  <text x="960" y="400" font-family="Arial, sans-serif" font-size="24" fill="#fbbf24" text-anchor="middle">February 2-9, 2026</text>
  
  <!-- Tagline -->
  <text x="960" y="460" font-family="Arial, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Build generative UI applications. May the components be with you.</text>
</svg>
