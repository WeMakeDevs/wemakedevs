  <!-- Glow effects -->
  <circle cx="500" cy="250" r="200" fill="#00cfb4" opacity="0.05"/>
  <circle cx="700" cy="400" r="150" fill="#a855f7" opacity="0.04"/>
  <circle cx="300" cy="450" r="120" fill="#f97316" opacity="0.04"/>
  <!-- Title text -->
  <text x="500" y="260" text-anchor="middle" fill="#00cfb4" font-size="72" font-weight="bold" font-family="system-ui, sans-serif">Kestra</text>
  <text x="500" y="340" text-anchor="middle" fill="white" font-size="52" font-weight="bold" font-family="system-ui, sans-serif">Orchestration</text>
  <text x="500" y="410" text-anchor="middle" fill="#f97316" font-size="52" font-weight="bold" font-family="system-ui, sans-serif">Challenge</text>
  <!-- Subtitle -->
  <text x="500" y="480" text-anchor="middle" fill="#94a3b8" font-size="24" font-family="system-ui, sans-serif">Learn. Get Certified. Win Prizes.</text>
  <!-- Date badge -->
  <rect x="390" y="510" width="220" height="40" rx="20" fill="#f97316" opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1"/>
  <text x="500" y="536" text-anchor="middle" fill="#f97316" font-size="18" font-weight="600" font-family="system-ui, sans-serif">May 4 – 17, 2026</text>
