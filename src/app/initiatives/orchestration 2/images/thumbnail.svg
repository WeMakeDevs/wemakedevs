    <line x1="120" y1="0" x2="120" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="700" stroke="#00cfb4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="700" stroke="#00cfb4" stroke-width="1"/>
