<svg width="1000" height="700" viewBox="0 0 1000 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3ec"/>
      <stop offset="55%" stop-color="#f3e2c0"/>
      <stop offset="100%" stop-color="#ecd2a4"/>
    </linearGradient>
    <linearGradient id="tbSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ff9e3d"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#tbSky)"/>

  <!-- sun -->
  <circle cx="500" cy="150" r="80" fill="url(#tbSun)"/>
  <g stroke="#ffcf66" stroke-width="7" stroke-linecap="round" opacity="0.7">
    <line x1="500" y1="20" x2="500" y2="55"/>
    <line x1="620" y1="60" x2="598" y2="88"/>
    <line x1="380" y1="60" x2="402" y2="88"/>
    <line x1="680" y1="150" x2="640" y2="150"/>
    <line x1="320" y1="150" x2="360" y2="150"/>
  </g>

  <!-- dunes -->
  <path d="M0 470 Q260 410 520 460 T1000 440 L1000 700 L0 700 Z" fill="#e6c88a"/>
  <path d="M0 560 Q300 500 620 555 T1000 535 L1000 700 L0 700 Z" fill="#dcb163"/>

  <!-- cacti -->
  <g fill="#7e9a4e">
    <rect x="85" y="470" width="20" height="120" rx="10"/>
    <path d="M85 520 H64 a10 10 0 0 0 -10 10 v16 a10 10 0 0 0 10 10 V540 h21 Z"/>
    <path d="M105 506 H126 a10 10 0 0 1 10 10 v22 a10 10 0 0 1 -10 10 V526 h-21 Z"/>
  </g>

  <!-- title -->
  <text x="500" y="300" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="78" fill="#c33124" font-style="italic">THE HANGOVER</text>
  <text x="500" y="380" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="96" fill="#b07d12" font-style="italic">PART AI</text>
  <text x="500" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="32" fill="#0e8a80" letter-spacing="3">WHERE'S MY CONTEXT?</text>

  <!-- subtitle -->
  <text x="500" y="610" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#3a2a1c" font-style="italic">Build AI that doesn't forget.</text>

  <!-- prize chip -->
  <rect x="360" y="630" width="280" height="52" rx="26" fill="#c33124" stroke="#f6c453" stroke-width="3"/>
  <text x="500" y="666" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="#fff8e6">$10,000 IN PRIZES</text>

  <!-- poker chips -->
  <circle cx="90" cy="650" r="40" fill="#c33124"/>
  <circle cx="90" cy="650" r="40" fill="none" stroke="#fff8e6" stroke-width="4" stroke-dasharray="10 14"/>
  <circle cx="910" cy="650" r="40" fill="#0e8a80"/>
  <circle cx="910" cy="650" r="40" fill="none" stroke="#fff8e6" stroke-width="4" stroke-dasharray="10 14"/>
</svg>
