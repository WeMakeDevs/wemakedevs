<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="30" r="1" fill="white" opacity="0.8"/>
  <circle cx="120" cy="80" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="200" cy="50" r="1" fill="white" opacity="0.9"/>
  <circle cx="300" cy="100" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="400" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="500" cy="90" r="2" fill="white" opacity="0.8"/>
  <circle cx="600" cy="60" r="1" fill="white" opacity="0.6"/>
  <circle cx="700" cy="100" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="750" cy="30" r="1" fill="white" opacity="0.7"/>
  <circle cx="80" cy="500" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="180" cy="550" r="1" fill="white" opacity="0.8"/>
  <circle cx="280" cy="520" r="2" fill="white" opacity="0.6"/>
  <circle cx="450" cy="560" r="1" fill="white" opacity="0.9"/>
  <circle cx="550" cy="510" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="650" cy="540" r="1" fill="white" opacity="0.5"/>
  <circle cx="720" cy="500" r="2" fill="white" opacity="0.8"/>
  
  <!-- Lightsaber accent -->
  <rect x="50" y="220" width="150" height="4" rx="2" fill="#f59e0b" filter="url(#glowEffect)" opacity="0.7"/>
  <rect x="600" y="380" width="150" height="4" rx="2" fill="#f59e0b" filter="url(#glowEffect)" opacity="0.7"/>
  
  <!-- Title -->
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" filter="url(#glowEffect)">THE UI</text>
  <text x="400" y="310" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" filter="url(#glowEffect)">STRIKES BACK</text>
  
  <!-- Subtitle -->
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">WeMakeDevs Hackathon</text>
  
  <!-- Date -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="20" fill="#fbbf24" text-anchor="middle">Feb 2-9, 2026</text>
  
  <!-- Prize -->
  <text x="400" y="470" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f59e0b" text-anchor="middle">$6,000+ in Prizes</text>
  
  <!-- Powered by -->
  <text x="400" y="520" font-family="Arial, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">Powered by Tambo</text>
</svg>
